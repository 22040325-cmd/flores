<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>para ti...</title>
  <link rel="icon" type="image/jpg" href="llave.png">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
  <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,400;1,600&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(ellipse at bottom, #0d1d31 0%, #0c1022 100%);
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }
    .pretty-subtitle {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      letter-spacing: 0.05em;
      word-spacing: 0.1em;
    }
    .glow-card {
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      z-index: 10;
    }
    .glow-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 40px 0 rgba(56, 189, 248, 0.2);
    }
    .stars-background {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      background-image: 
        radial-gradient(1.5px 1.5px at 20px 30px, rgba(255, 255, 255, 0.8), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 40px 70px, rgba(255, 255, 255, 0.6), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 90px 40px, rgba(255, 255, 255, 0.9), rgba(0,0,0,0)),
        radial-gradient(1px 1px at 160px 120px, rgba(255, 255, 255, 0.7), rgba(0,0,0,0)),
        radial-gradient(1.5px 1.5px at 230px 190px, rgba(255, 255, 255, 0.5), rgba(0,0,0,0)),
        radial-gradient(2px 2px at 310px 80px, rgba(255, 255, 255, 0.8), rgba(0,0,0,0));
      background-repeat: repeat;
      background-size: 350px 350px;
      opacity: 0.7;
    }
    .shooting-star {
      position: fixed;
      width: 120px;
      height: 2px;
      background: linear-gradient(-45deg, rgba(255, 255, 255, 1), rgba(255, 255, 255, 0));
      border-radius: 999px;
      filter: drop-shadow(0 0 6px rgba(125, 211, 252, 0.8));
      animation: tail 3s ease-in-out infinite, shooting 3s ease-in-out infinite;
      pointer-events: none;
      z-index: 1;
      opacity: 0;
    }
    .shooting-star:nth-child(1) { top: 10%; left: 80%; animation-delay: 0s; }
    .shooting-star:nth-child(2) { top: 35%; left: 90%; animation-delay: 4.5s; }
    .shooting-star:nth-child(3) { top: 60%; left: 75%; animation-delay: 8s; }
    @keyframes tail {
      0% { width: 0; opacity: 0; }
      30% { width: 120px; opacity: 1; }
      100% { width: 0; opacity: 0; }
    }
    @keyframes shooting {
      0% { transform: translateX(0) translateY(0) rotate(-35deg); }
      100% { transform: translateX(-600px) translateY(600px) rotate(-35deg); }
    }
  </style>
</head>
<body class="flex flex-col items-center justify-center p-4 md:p-8">

  <div class="stars-background"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>
  <div class="shooting-star"></div>

  <header class="text-center my-4 max-w-2xl px-2 z-10">
    <h1 class="text-3xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-300 mb-2">
      \(\mathbb{S}usette\)
    </h1>
    <p class="pretty-subtitle text-slate-200 text-lg md:text-2xl font-medium">
      So siehst du aus, wenn du durch meine Augen betrachtet wirst
Asi de increible luces ante mis ojos.
    </p>
  </header>

  <main class="w-full max-w-6xl grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-8 my-auto z-10">
    <section class="glow-card rounded-2xl p-3 md:p-5 flex flex-col items-center text-center">
      <div class="w-full rounded-xl overflow-hidden shadow-lg bg-black/40 flex items-center justify-center">
        <video src="Pitagoras.mp4" autoplay loop muted playsinline class="w-full h-auto max-h-[75vh] object-contain rounded-xl"></video>
      </div>
    </section>

    <section class="glow-card rounded-2xl p-3 md:p-5 flex flex-col items-center text-center">
      <div class="w-full rounded-xl overflow-hidden shadow-lg bg-black/40 flex items-center justify-center">
        <video src="r=cos(6t)+1.mp4" autoplay loop muted playsinline class="w-full h-auto max-h-[75vh] object-contain rounded-xl"></video>
      </div>
    </section>
  </main> 

</body>
</html>
